version: '3.8'
services:
  app:
    build: .
    container_name: valuator-app
    ports:
      - "5000:80"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    networks:
      - valuator-network
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: valuator-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - valuator-network

networks:
  valuator-network:
    driver: bridge