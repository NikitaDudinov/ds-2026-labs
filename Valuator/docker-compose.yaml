version: '3.8'

services:
  app1:
    build: .
    container_name: valuator-app-1
    ports:
      - "5001:80"
    depends_on:
      redis-main:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - DB_MAIN=redis-main:6379
      - DB_RU=redis-ru:6379
      - DB_EU=redis-eu:6379
      - DB_ASIA=redis-asia:6379
    networks:
      - valuator-network
    volumes:
      - shared-keys:/root/.aspnet/DataProtection-Keys

  app2:
    build: .
    container_name: valuator-app-2
    ports:
      - "5002:80"
    depends_on:
      redis-main:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - DB_MAIN=redis-main:6379
      - DB_RU=redis-ru:6379
      - DB_EU=redis-eu:6379
      - DB_ASIA=redis-asia:6379
    networks:
      - valuator-network
    volumes:
      - shared-keys:/root/.aspnet/DataProtection-Keys

  nginx:
    image: nginx:latest
    container_name: valuator-nginx
    volumes:
      - ../nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/var/log/nginx
    ports:
      - "8080:8080"
    depends_on:
      - app1
      - app2
    networks:
      - valuator-network

  redis-main:
    image: redis:latest
    container_name: valuator-redis-main
    command: redis-server --requirepass ${REDIS_MAIN_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_MAIN_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - valuator-network

  redis-ru:
    image: redis:latest
    container_name: valuator-redis-ru
    command: redis-server --requirepass ${REDIS_RU_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_RU_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - valuator-network

  redis-eu:
    image: redis:latest
    container_name: valuator-redis-eu
    command: redis-server --requirepass ${REDIS_EU_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_EU_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - valuator-network

  redis-asia:
    image: redis:latest
    container_name: valuator-redis-asia
    command: redis-server --requirepass ${REDIS_ASIA_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_ASIA_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - valuator-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: valuator-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBIT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBIT_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - valuator-network

  rank-calculator:
    build:
      context: ../RankCalculator
      dockerfile: Dockerfile
    depends_on:
      redis-main:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_MAIN=redis-main:6379
      - DB_RU=redis-ru:6379
      - DB_EU=redis-eu:6379
      - DB_ASIA=redis-asia:6379
    deploy:
      replicas: 2
    networks:
      - valuator-network

  events-logger:
    build:
      context: ../EventsLogger
      dockerfile: Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
    deploy:
      replicas: 2
    networks:
      - valuator-network

  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: valuator-centrifugo
    environment:
      - CENTRIFUGO_TOKEN_HMAC_SECRET_KEY=super_secret_hmac_key_for_valuator_app_12345
      - CENTRIFUGO_API_KEY=my_super_secret_api_key
      - CENTRIFUGO_ALLOWED_ORIGINS=http://localhost:8080
      - CENTRIFUGO_ALLOW_SUBSCRIBE_FOR_CLIENT=true
    ports:
      - "8001:8000"
    networks:
      - valuator-network

networks:
  valuator-network:
    driver: bridge

volumes:
  shared-keys: