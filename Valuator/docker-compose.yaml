version: '3.8'

services:
  app1:
    build: .
    container_name: valuator-app-1
    ports:
      - "5001:80"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    networks:
      - valuator-network

  app2:
    build: .
    container_name: valuator-app-2
    ports:
      - "5002:80"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    networks:
      - valuator-network

  nginx:
    image: nginx:latest
    container_name: valuator-nginx
    volumes:
      - ../nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/var/log/nginx
    ports:
      - "8080:8080"
    depends_on:
      - app1
      - app2
    networks:
      - valuator-network

  redis:
    image: redis:latest
    container_name: valuator-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - valuator-network

networks:
  valuator-network:
    driver: bridge